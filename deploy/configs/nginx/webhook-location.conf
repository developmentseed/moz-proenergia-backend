# Nginx configuration snippet for webhook endpoint
# Add this location block to your existing nginx site configuration

location /deploy-webhook {
    # Only allow POST requests
    limit_except POST {
        deny all;
    }
    
    # Proxy to webhook listener
    proxy_pass http://127.0.0.1:9001/webhook;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    
    # Pass GitHub headers
    proxy_pass_header X-GitHub-Event;
    proxy_pass_header X-Hub-Signature-256;
    proxy_pass_header X-GitHub-Delivery;
    
    # Timeouts
    proxy_connect_timeout 10s;
    proxy_send_timeout 10s;
    proxy_read_timeout 10s;
    
    # Optional: Restrict to GitHub webhook IPs
    # GitHub publishes their webhook IPs at: https://api.github.com/meta
    # Uncomment and update these lines to restrict access:
    # allow 140.82.112.0/20;
    # allow 143.55.64.0/20;
    # allow 185.199.108.0/22;
    # allow 192.30.252.0/22;
    # allow 2606:50c0::/32;
    # allow 2a0a:a440::/29;
    # deny all;
    
    # Logging
    access_log /var/log/nginx/webhook_access.log;
    error_log /var/log/nginx/webhook_error.log;
}